name: Restore Known Good GPT-Video2Anime

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Restore exact known-good commit
        shell: bash
        run: |
          set -e

          SOURCE_REPO="https://github.com/pri4esh-ai/GPT-Video2Anime.git"
          SOURCE_COMMIT="fe9a776191a7463af1980c04726ad0ac71e64841"

          git clone "$SOURCE_REPO" /tmp/GPT-Video2Anime

          cd /tmp/GPT-Video2Anime
          git checkout "$SOURCE_COMMIT"

          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

          echo "Known-good commit verified."

      - name: Copy project without source Git metadata
        shell: bash
        run: |
          set -e

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            -exec rm -rf {} +

          cd /tmp/GPT-Video2Anime

          tar \
            --exclude='.git' \
            -cf - . \
            | tar -xf - -C "$GITHUB_WORKSPACE"

          cd "$GITHUB_WORKSPACE"

      - name: Verify restored project
        shell: bash
        run: |
          set -e

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f gradlew
          test -d .git

          echo "Android project verification PASSED."
          echo "Destination .git preserved."

      - name: Commit restored project
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "Restore known-good GPT-Video2Anime commit fe9a776"

      - name: Push restored project
        shell: bash
        run: |
          set -e

          git push origin HEAD:main

          echo "========================================"
          echo "RESTORE SUCCESSFUL"
          echo "========================================"

      - name: Final verification
        shell: bash
        run: |
          set -e

          echo "Final commit:"
          git rev-parse HEAD

          test -d app
          test -d gradle
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradlew

          echo "GPT-Video2Anime restored successfully."
