name: Restore Known Good Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Import exact fe9a776 snapshot
        run: |
          set -e

          TARGET="fe9a776191a7463af1980c04726ad0ac71e64841"
          SOURCE_REPO="https://github.com/pri4esh-ai/GPT-Video2Anime.git"

          echo "Downloading source repository..."
          git clone "$SOURCE_REPO" source

          cd source

          echo "Checking target commit..."
          git cat-file -t "$TARGET"
          git show --no-patch --oneline "$TARGET"

          echo "Switching to exact target..."
          git checkout "$TARGET"

          cd ..

          echo "Replacing destination working tree..."

          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name source \
            -exec rm -rf {} +

          cp -a source/. .

          rm -rf source

          echo "Adding exact fe9a776 project..."
          git add -A

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Restore project from known-good fe9a776" || true

          echo "Pushing restored project..."

          git push origin HEAD:main

          echo "========================================"
          echo "RESTORE COMPLETE"
          echo "========================================"
